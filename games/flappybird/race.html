<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ACCESCO Delivery - Speed Logistics</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&family=Russo+One&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Montserrat', sans-serif; background-color: #121212; user-select: none; -webkit-user-select: none; touch-action: none; }
        
        /* --- UI LAYER --- */
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; display: flex; flex-direction: column; justify-content: space-between; }
        .pointer-events-auto { pointer-events: auto; }

        /* --- FLEET HUB / MENU SCREEN --- */
        #menu-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, rgba(0, 0, 0, 0) 0%, rgba(0, 0, 0, 0.2) 50%, rgba(0, 0, 0, 0.7) 100%);
            z-index: 20; display: flex; flex-direction: column; justify-content: space-between;
            pointer-events: none;
        }

        .garage-header {
            padding: 20px; text-align: center; pointer-events: auto;
            background: linear-gradient(to bottom, rgba(0,0,0,0.6), transparent);
            position: relative;
        }
        .garage-title {
            font-family: 'Russo One', sans-serif; font-size: clamp(24px, 8vw, 42px); color: #fc8019;
            text-transform: uppercase; letter-spacing: 2px;
            text-shadow: 0 4px 15px rgba(252, 128, 25, 0.4); margin: 0;
        }
        .garage-subtitle { color: #fff; font-size: clamp(10px, 2vw, 14px); letter-spacing: 4px; margin-top: 5px; text-transform: uppercase; font-weight: 600; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }

        .bank-display {
            position: absolute; top: 20px; right: 20px;
            background: rgba(0,0,0,0.6); padding: 8px 15px; border-radius: 20px;
            border: 1px solid #ffd700; color: #ffd700; font-family: 'Russo One'; font-size: 14px;
            display: flex; align-items: center; gap: 8px;
        }

        .car-stats-panel {
            position: absolute; top: 140px; left: 30px;
            background: rgba(0, 0, 0, 0.4); backdrop-filter: blur(12px);
            padding: 20px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.1);
            width: 180px;
            pointer-events: none;
            transition: all 0.3s ease;
        }

        .stat-row { margin-bottom: 12px; }
        .stat-label { color: #ccc; font-size: 10px; font-weight: 800; text-transform: uppercase; margin-bottom: 4px; }
        .stat-track { width: 100%; height: 6px; background: rgba(0,0,0,0.5); border-radius: 10px; overflow: hidden; }
        .stat-val { height: 100%; background: linear-gradient(90deg, #fc8019, #ff9f43); width: 0%; transition: width 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); }

        .garage-footer {
            background: linear-gradient(to top, rgba(0,0,0,0.8) 20%, transparent);
            padding: 10px 0 40px 0;
            display: flex; flex-direction: column; align-items: center;
            pointer-events: auto;
        }

        .car-carousel {
            display: flex; gap: 15px; overflow-x: auto; padding: 10px 20px;
            width: 100%; box-sizing: border-box;
            scroll-behavior: smooth;
            justify-content: flex-start;
            scrollbar-width: none;
        }
        .car-carousel::-webkit-scrollbar { display: none; }

        .car-card {
            background: rgba(255, 255, 255, 0.05);
            min-width: 130px; padding: 12px; border-radius: 15px;
            border: 2px solid rgba(255,255,255,0.1);
            transition: all 0.3s ease;
            cursor: pointer; text-align: center;
            backdrop-filter: blur(8px);
            position: relative;
        }
        
        .car-card:hover, .car-card.selected {
            background: rgba(252, 128, 25, 0.2);
            border-color: #fc8019; transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.4);
        }

        .car-card.locked { opacity: 0.6; filter: grayscale(1); }
        .lock-icon { position: absolute; top: 8px; right: 8px; font-size: 14px; }

        .car-card-name { color: #fff; font-weight: 700; font-size: 12px; margin-bottom: 4px; }
        .car-card-type { color: #ddd; font-size: 9px; text-transform: uppercase; }

        .btn-drive {
            background: linear-gradient(to right, #fc8019, #ff9f43);
            color: white; border: none; padding: 15px 60px;
            font-family: 'Russo One', sans-serif; font-size: 20px; text-transform: uppercase;
            border-radius: 50px; cursor: pointer; margin-top: 20px;
            box-shadow: 0 0 30px rgba(252, 128, 25, 0.4);
            transition: all 0.2s; pointer-events: auto;
            max-width: 80%;
        }
        .btn-drive:active { transform: scale(0.95); filter: brightness(1.2); }
        .btn-drive.buy-btn { background: linear-gradient(to right, #27ae60, #2ecc71); box-shadow: 0 0 30px rgba(46, 204, 113, 0.4); }
        .btn-drive:disabled { background: #333; color: #666; cursor: not-allowed; box-shadow: none; }

        /* --- RESPONSIVE OVERRIDES --- */
        @media (max-width: 600px) {
            .car-stats-panel { 
                top: auto; bottom: 320px; left: 50%; 
                transform: translateX(-50%); width: 85%; max-width: 280px;
                display: flex; gap: 10px; padding: 12px;
            }
            .stat-row { margin-bottom: 0; flex: 1; }
            .bank-display { top: 10px; right: 10px; font-size: 12px; }
            .garage-header { padding-top: 40px; }
        }

        @media (max-height: 600px) {
            .car-stats-panel { display: none; }
            .garage-header { padding: 10px; }
            .garage-footer { padding-bottom: 10px; }
            .btn-drive { margin-top: 10px; padding: 10px 40px; font-size: 16px; }
            .car-carousel { padding: 5px 20px; }
        }

        /* --- IN GAME HUD --- */
        #game-hud { display: none; width: 100%; height: 100%; pointer-events: none; position: relative; }

        .hud-top {
            display: flex; justify-content: space-between; padding: 15px; align-items: flex-start;
            position: relative; z-index: 20; 
        }
        
        .stats-box {
            background: rgba(0, 0, 0, 0.8); backdrop-filter: blur(12px);
            padding: 12px 18px; border-radius: 15px; border-top: 3px solid #fc8019;
            color: white; font-family: 'Russo One', sans-serif;
            display: flex; flex-direction: column; gap: 5px;
            min-width: 120px;
        }

        .hud-row { display: flex; justify-content: space-between; align-items: center; gap: 15px; }
        .hud-label { font-size: 9px; color: #888; text-transform: uppercase; letter-spacing: 1px; }
        .hud-val { font-size: 18px; }

        .fuel-bar-track { width: 100%; height: 5px; background: #222; border-radius: 10px; margin-top: 3px; overflow: hidden; }
        .fuel-bar-fill { width: 100%; height: 100%; background: linear-gradient(90deg, #4cd137, #fc8019); transition: width 0.2s; }

        .hud-controls { display: flex; gap: 10px; pointer-events: auto; }
        .hud-btn {
            background: rgba(0,0,0,0.6); width: 45px; height: 45px; border-radius: 12px;
            display: flex; align-items: center; justify-content: center; color: white; border: 1px solid rgba(255,255,255,0.1);
            cursor: pointer; font-size: 18px; transition: all 0.2s;
        }
        .hud-btn:active { transform: scale(0.9); background: #fc8019; }

        .touch-zones { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; pointer-events: auto; z-index: 5; }
        .touch-half { width: 50%; height: 100%; }
        
        #pause-modal, #game-over-modal { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); backdrop-filter: blur(10px); align-items: center; justify-content: center; z-index: 30; pointer-events: auto; }
        .modal-card { background: #1a1a1a; padding: 30px; border-radius: 25px; text-align: center; border: 1px solid #333; box-shadow: 0 20px 60px rgba(0,0,0,0.8); width: 85%; max-width: 340px; }
        .modal-title { color: #fff; font-family: 'Russo One'; font-size: 28px; margin-bottom: 15px; text-transform: uppercase; letter-spacing: 2px; }
        .modal-score { color: #fc8019; font-size: 44px; font-weight: 800; margin: 5px 0 20px 0; }
        .sub-score-label { color: #666; font-size: 10px; letter-spacing: 2px; text-transform: uppercase; font-weight: 800; }

        .hint-text { position: absolute; bottom: 20px; width: 100%; text-align: center; color: rgba(255,255,255,0.6); font-size: 9px; letter-spacing: 2px; font-weight: 800; text-transform: uppercase; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
        #canvas-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; background: #87CEEB;}
    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <audio id="bg-music" loop>
        <source src="https://cdn.pixabay.com/audio/2022/03/24/audio_3a40af212a.mp3?filename=fun-life-112188.mp3" type="audio/mpeg">
    </audio>

    <div id="ui-layer">
        
        <div id="menu-screen">
            <div class="garage-header">
                <h1 class="garage-title">ACCESCO DELIVERY</h1>
                <div class="garage-subtitle">Choose Your Premium Fleet</div>
                <div class="bank-display">
                    <span>🪙</span> <span id="bank-val">0</span>
                </div>
            </div>

            <div class="car-stats-panel" id="stats-panel">
                <div class="stat-row">
                    <div class="stat-label">Velocity</div>
                    <div class="stat-track"><div class="stat-val" id="stat-speed"></div></div>
                </div>
                <div class="stat-row">
                    <div class="stat-label">Agility</div>
                    <div class="stat-track"><div class="stat-val" id="stat-handling"></div></div>
                </div>
                <div class="stat-row">
                    <div class="stat-label">Payload</div>
                    <div class="stat-track"><div class="stat-val" id="stat-weight"></div></div>
                </div>
            </div>

            <div class="garage-footer">
                <div class="car-carousel" id="car-list"></div>
                <button class="btn-drive" id="main-btn" onclick="handleMainButton()">START SHIFT</button>
            </div>
        </div>

        <div id="game-hud">
            <div class="touch-zones">
                <div class="touch-half" id="zone-left"></div>
                <div class="touch-half" id="zone-right"></div>
            </div>

            <div class="hud-top">
                <div class="stats-box">
                    <div class="hud-row">
                        <span class="hud-label">LOGS</span>
                        <span class="hud-val" id="dist-val">0m</span>
                    </div>
                    <div class="hud-row">
                        <span class="hud-label">TIPS</span>
                        <span class="hud-val" id="coin-val" style="color: #ffd700;">0</span>
                    </div>
                    <div class="hud-row">
                        <span class="hud-label">ENERGY</span>
                        <span class="hud-val" id="fuel-text">100%</span>
                    </div>
                    <div class="fuel-bar-track">
                        <div class="fuel-bar-fill" id="fuel-bar"></div>
                    </div>
                </div>

                <div class="hud-controls">
                <div class="hud-btn" onclick="toggleMusic()">🔊</div>
                <div class="hud-btn" onclick="togglePause()">II</div>
                <div class="hud-btn" onclick="switchCamera()">🎥</div>
            </div>
        </div>

        <div class="hint-text">TAP SIDES TO NAVIGATE TRAFFIC</div>
    </div>

    <div id="pause-modal">
        <div class="modal-card">
            <div class="modal-title">SHIFT PAUSED</div>
            <button class="btn-drive" onclick="togglePause()" style="padding: 12px 40px; font-size: 16px;">RESUME</button>
            <button class="btn-drive" onclick="resetGame()" style="padding: 12px 40px; font-size: 16px; background: #333; margin-top: 10px; box-shadow: none;">ABORT SHIFT</button>
        </div>
    </div>

    <div id="game-over-modal">
        <div class="modal-card">
            <div class="modal-title" id="go-title-text">SHIFT ENDED</div>
            <div class="sub-score-label">TOTAL DISTANCE</div>
            <div class="modal-score" id="final-score">0m</div>
            <div class="sub-score-label">EARNED TIPS</div>
            <div class="modal-score" style="font-size: 28px; color: #ffd700;" id="final-coins">0</div>
            <button class="btn-drive" onclick="resetGame()" style="padding: 15px 40px; font-size: 18px;">NEW SHIFT</button>
        </div>
    </div>
</div>

<script src="../../js/flappybird-race.js"></script>
</body>
</html>
