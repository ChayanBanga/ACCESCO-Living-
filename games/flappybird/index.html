<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flappy Bird Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            color: #333;
            padding: 0;
            margin: 0;
        }

        .top-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 300;
            padding: 14px 18px;
            background: linear-gradient(135deg, rgba(0, 0, 0, 0.55), rgba(0, 0, 0, 0.35));
            border-bottom: 1px solid rgba(255, 255, 255, 0.18);
            backdrop-filter: blur(14px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.25);
        }

        .top-bar-inner {
            max-width: 980px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }

        .brand {
            text-align: left;
            color: rgba(255, 255, 255, 0.95);
            min-width: 210px;
        }

        .brand-title {
            font-size: 26px;
            font-weight: 800;
            letter-spacing: -0.8px;
            line-height: 1.1;
            background: linear-gradient(135deg, #ffffff, #ffd700);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 8px 22px rgba(0, 0, 0, 0.25);
        }

        .brand-subtitle {
            margin-top: 4px;
            font-size: 12px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.75);
        }

        .container {
            text-align: center;
            width: 100vw;
            height: 100vh;
            padding: 0;
            animation: slideIn 0.6s ease-out;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            display: none;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }

        #gameCanvas {
            border: none;
            border-radius: 0;
            box-shadow: none;
            display: block;
            margin: 0;
            cursor: pointer;
            background: #87CEEB;
            transition: none;
            width: 100vw;
            height: 100vh;
            object-fit: fill;
        }

        #gameCanvas:hover {
            transform: none;
            box-shadow: none;
        }

        .controls {
            display: none;
        }

        .controls p {
            margin: 12px 0;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
            font-weight: 500;
        }

        .controls p:first-child {
            margin-top: 0;
        }

        .controls p:last-child {
            margin-bottom: 0;
        }

        .key {
            display: inline-block;
            padding: 6px 14px;
            background: linear-gradient(135deg, rgba(255,255,255,0.3), rgba(255,255,255,0.1));
            border: 2px solid rgba(255,255,255,0.6);
            border-radius: 8px;
            margin: 0 6px;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .key:hover {
            background: linear-gradient(135deg, rgba(255,255,255,0.5), rgba(255,255,255,0.3));
            border-color: #fff;
            transform: scale(1.1);
        }

        #scoreBoard {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.14), rgba(255, 255, 255, 0.06));
            padding: 10px 14px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.18);
            display: flex;
            gap: 14px;
            align-items: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
            white-space: nowrap;
        }

        #score, #highScore, #level {
            color: #fff;
            font-size: 14px;
            font-weight: 700;
            text-shadow: 0 3px 8px rgba(0,0,0,0.5);
            letter-spacing: 0.5px;
        }

        #highScore {
            color: #ffd700;
            text-shadow: 0 3px 8px rgba(255,215,0,0.4);
        }

        #level {
            color: #00ff88;
            text-shadow: 0 3px 8px rgba(0,255,136,0.4);
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        .game-over {
            animation: shake 0.5s ease-in-out;
        }

        /* Music Player Styles */
        .music-player {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.95), rgba(118, 75, 162, 0.95));
            padding: 20px;
            border-radius: 15px;
            backdrop-filter: blur(15px);
            border: 2px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.3);
            z-index: 200;
            width: 320px;
            min-width: 300px;
            color: #fff;
        }

        .music-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            font-weight: 700;
            font-size: 16px;
        }

        .music-toggle-btn {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #fff;
            border-radius: 8px;
            padding: 6px 12px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .music-toggle-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(1.05);
        }

        .music-content {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .music-search {
            display: flex;
            gap: 8px;
        }

        .music-search input {
            flex: 1;
            padding: 10px 14px;
            border: 1.5px solid rgba(255, 255, 255, 0.3);
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.2);
            color: #fff;
            font-size: 13px;
            transition: all 0.2s ease;
        }

        .music-search input::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }

        .music-search input:focus {
            outline: none;
            border-color: rgba(255, 255, 255, 0.6);
            background: rgba(0, 0, 0, 0.3);
            box-shadow: 0 0 10px rgba(240, 147, 251, 0.3);
        }

        .music-search button {
            padding: 10px 18px;
            background: linear-gradient(135deg, rgba(240, 147, 251, 0.8), rgba(102, 126, 234, 0.8));
            border: none;
            border-radius: 8px;
            color: #fff;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 12px;
        }

        .music-search button:hover {
            background: linear-gradient(135deg, rgba(240, 147, 251, 1), rgba(102, 126, 234, 1));
            transform: scale(1.05);
        }

        .music-results {
            max-height: 200px;
            overflow-y: auto;
            margin-top: 8px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(0, 0, 0, 0.2);
        }

        .music-results::-webkit-scrollbar {
            width: 6px;
        }

        .music-results::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }

        .music-results::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.3);
            border-radius: 10px;
        }

        .music-result-item {
            padding: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            cursor: pointer;
            font-size: 12px;
            transition: background 0.2s ease;
        }

        .music-result-item:last-child {
            border-bottom: none;
        }

        .music-result-item:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .music-result-title {
            font-weight: 600;
            margin-bottom: 4px;
        }

        .music-result-artist {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.7);
        }

        .music-current {
            background: rgba(0, 0, 0, 0.3);
            padding: 12px;
            border-radius: 8px;
            margin-top: 10px;
            font-size: 12px;
        }

        .music-current-title {
            font-weight: 600;
            margin-bottom: 6px;
            color: #ffd700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .music-current-artist {
            color: rgba(255, 255, 255, 0.7);
            font-size: 11px;
            margin-bottom: 8px;
        }

        .music-controls {
            display: flex;
            gap: 8px;
            justify-content: space-between;
        }

        .music-btn {
            flex: 1;
            padding: 8px 12px;
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #fff;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .music-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(1.05);
        }

        .music-btn.active {
            background: rgba(240, 147, 251, 0.8);
            border-color: rgba(240, 147, 251, 1);
        }

        .music-volume {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
        }

        .music-volume-label {
            font-size: 11px;
            min-width: 35px;
        }

        .music-volume input {
            flex: 1;
            height: 6px;
            border-radius: 5px;
            background: rgba(255, 255, 255, 0.2);
            outline: none;
            -webkit-appearance: none;
            appearance: none;
        }

        .music-volume input::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(240, 147, 251, 1), rgba(102, 126, 234, 1));
            cursor: pointer;
        }

        .music-volume input::-moz-range-thumb {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(240, 147, 251, 1), rgba(102, 126, 234, 1));
            cursor: pointer;
            border: none;
        }

        .music-loading {
            text-align: center;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.7);
            padding: 10px;
        }

        .spinner {
            display: inline-block;
            width: 12px;
            height: 12px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 600px) {
            body {
                padding-top: 120px;
            }

            .top-bar-inner {
                flex-direction: column;
                align-items: stretch;
                gap: 10px;
            }

            .brand {
                text-align: center;
                min-width: auto;
            }

            .brand-title {
                font-size: 24px;
            }

            #scoreBoard {
                gap: 15px;
                padding: 12px 20px;
                font-size: 16px;
                flex-wrap: wrap;
                justify-content: center;
            }

            #score, #highScore, #level {
                font-size: 14px;
            }

            .controls {
                font-size: 14px;
                padding: 15px;
                margin-top: 20px;
            }

            .controls p {
                margin: 10px 0;
            }

            .music-player {
                width: 280px;
                padding: 15px;
                bottom: 10px;
                right: 10px;
            }
        }
    </style>
</head>
<body>
    <!-- Audio Element -->
    <audio id="bgMusic" loop crossorigin="anonymous"></audio>

    <!-- Top Header -->
    <header class="top-bar">
        <div class="top-bar-inner">
            <div class="brand">
                <div class="brand-title">Flappy Bird</div>
                <div class="brand-subtitle">Press ↑ to flap • Press ↓ to drop</div>
            </div>
            <div id="scoreBoard">
                <span id="level">Level: 1</span>
                <span id="score">Score: 0</span>
                <span id="highScore">Best: 0</span>
            </div>
        </div>
    </header>

    <!-- Music Player -->
    <div class="music-player">
        <div class="music-header">
            <span>🎵 Music Player</span>
            <button class="music-toggle-btn" id="toggleMusicPanel" title="Minimize/Maximize">−</button>
        </div>
        <div class="music-content" id="musicContent">
            <div class="music-search">
                <input type="text" id="musicSearchInput" placeholder="Search songs..." />
                <button id="musicSearchBtn">🔍</button>
            </div>
            <div class="music-results" id="musicResults"></div>
            <div class="music-current" id="musicCurrentInfo" style="display: none;">
                <div class="music-current-title" id="currentTitle">No song playing</div>
                <div class="music-current-artist" id="currentArtist">Search and select a song</div>
                <div class="music-controls">
                    <button class="music-btn" id="playBtn">▶ Play</button>
                    <button class="music-btn" id="pauseBtn">⏸ Pause</button>
                    <button class="music-btn" id="stopBtn">⏹ Stop</button>
                </div>
                <div class="music-volume">
                    <span class="music-volume-label">Vol:</span>
                    <input type="range" id="volumeControl" min="0" max="100" value="30" />
                </div>
            </div>
        </div>
    </div>

    <div class="container">
        <canvas id="gameCanvas"></canvas>
        <div class="controls">
            <p>🎮 Press <span class="key">↑</span> to Flap Up | Press <span class="key">↓</span> to Drop Down</p>
            <p>🎯 Avoid the Pipes and Stay Alive!</p>
        </div>
    </div>

    <script src="../../js/flappybird-music.js"></script>
    <script src="../../js/flappybird.js"></script>
</body>
</html>
